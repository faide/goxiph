# goxiph toolchain and tasks.

[tools]
go = "1.26"
golangci-lint = "latest"
gotestsum = "latest"

# Reference codecs (ffmpeg, oggenc, opusenc, sox) stay system-installed — the mise builds are heavy
# and we only shell out to them in conformance tests. `mise run doctor` checks for them.

[env]
CGO_ENABLED = "0"  # goxiph is pure Go; cgo-check enforces it
GOFLAGS = "-mod=readonly"

[settings]
experimental = true

# --- everyday ---

[tasks.build]
description = "Build all packages"
run = "go build ./..."

[tasks.test]
description = "Unit and property tests, no external tools needed"
run = "gotestsum --format pkgname -- ./..."

[tasks.race]
description = "Tests under the race detector"
# The race runtime needs cgo. Test-time only; the library itself stays cgo-free.
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks.prose-check]
description = "Ban the emphasis adverbs listed in .banned-words"
run = '''
words=$(grep -vE '^\s*(#|$)' .banned-words | paste -sd'|')
hits=$(grep -rniE "\\b(${words})\\b" \
  --include='*.go' --include='*.toml' --include='*.yml' --include='*.md' \
  --exclude-dir=.git --exclude-dir=.specs \
  --exclude='conventions.md' --exclude='content.md' . || true)
if [ -n "$hits" ]; then
  echo "emphasis adverbs found; cut the adverb and add the fact:"
  echo "$hits"
  exit 1
fi
'''

[tasks.codes-check]
description = "Milestone and ADR codes may appear only in the plan docs that define them"
run = """
hits=$(grep -rnE '\\b(M[0-9][a-z]?)\\b|\\bADR ?[0-9]' \
  --include='*.go' --include='*.toml' --include='*.yml' --include='*.md' \
  --exclude-dir=.git --exclude-dir=.specs --exclude-dir=decisions \
  --exclude='roadmap.md' --exclude='status.md' --exclude='conventions.md' --exclude='content.md' . || true)
if [ -n "$hits" ]; then
  echo "internal codes leaked outside the plan; name the thing, not its code:"
  echo "$hits"
  exit 1
fi
"""

[tasks.cgo-check]
description = "No package may import C; goxiph is pure Go"
run = '''
hits=$(grep -rn --include='*.go' -E '^\s*import\s+"C"|^\s*"C"$' . || true)
[ -z "$hits" ] || { echo "cgo import found; goxiph is pure Go:"; echo "$hits"; exit 1; }
'''

[tasks.fmt]
description = "Format"
run = "gofmt -s -w ."

[tasks.fmt-check]
description = "Fail if anything is unformatted"
run = '''
out=$(gofmt -s -l .)
[ -z "$out" ] || { echo "unformatted:"; echo "$out"; exit 1; }
'''

[tasks.vet]
run = "go vet ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.ci]
description = "Pre-commit gate; must be green before starting new work"
depends = ["fmt-check", "vet", "lint", "cgo-check", "prose-check", "codes-check", "test", "race"]

# --- conformance ---

[tasks.doctor]
description = "Check the external reference tools used as test oracles"
run = '''
missing=0
for t in ffmpeg ffprobe oggenc oggdec opusenc opusdec ogginfo opusinfo sox; do
  if command -v "$t" >/dev/null 2>&1; then
    printf '  ok      %s\n' "$t"
  else
    printf '  MISSING %s\n' "$t"; missing=1
  fi
done
if [ "$missing" -ne 0 ]; then
  echo
  echo "Install with: sudo apt install ffmpeg vorbis-tools opus-tools sox"
  exit 1
fi
'''

[tasks."silk:tables"]
description = "Regenerate the SILK constant tables from the extracted reference"
run = "go run ./internal/testutil/silktables -out internal/silk/tables.go"

[tasks.fixtures]
description = "Synthesise the test corpus into testdata/generated; media is generated, never committed"
depends = ["doctor"]
run = "go run ./internal/testutil/gen -out testdata/generated"

[tasks.conformance]
description = "Tests that shell out to the reference codecs"
depends = ["fixtures"]
run = "gotestsum --format testname -- -tags conformance ./..."

[tasks."conformance:ogg"]
depends = ["fixtures"]
run = "go test -tags conformance -run Conformance ./ogg/..."

[tasks."conformance:vorbis-decode"]
depends = ["fixtures"]
run = "go test -tags conformance -run ConformanceDecode ./vorbis/..."

[tasks.bench]
description = "Benchmarks; steady-state loops must report 0 allocs/op"
run = "go test -run '^$' -bench . -benchmem ./..."

[tasks."ci:full"]
description = "Full gate: ci plus conformance and benchmarks"
depends = ["ci", "conformance", "bench"]

# --- fuzzing ---

[tasks.fuzz]
description = "Fuzz one target: mise run fuzz <pkg> <FuzzName> [duration]"
run = 'go test -run "^$" -fuzz "^${2:?fuzz target}$" -fuzztime "${3:-60s}" "./${1:?package}"'

# --- specs ---

[tasks."specs:fetch"]
description = "Mirror the normative specs into .specs/ for offline grep"
run = '''
mkdir -p .specs
curl -fsSL -o .specs/rfc3533-ogg.txt      https://www.rfc-editor.org/rfc/rfc3533.txt
curl -fsSL -o .specs/rfc6716-opus.txt     https://www.rfc-editor.org/rfc/rfc6716.txt
curl -fsSL -o .specs/rfc7845-oggopus.txt  https://www.rfc-editor.org/rfc/rfc7845.txt
curl -fsSL -o .specs/rfc9639-flac.txt     https://www.rfc-editor.org/rfc/rfc9639.txt
curl -fsSL -o .specs/vorbis-i-spec.html   https://www.xiph.org/vorbis/doc/Vorbis_I_spec.html
curl -fsSL -o .specs/v-comment.html       https://www.xiph.org/vorbis/doc/v-comment.html

# RFC 6716 embeds its reference implementation as base64 and states the archive's SHA1. Opus tables
# the prose never prints are checked against it, so extracting it keeps those checks runnable.
grep '^   ###' .specs/rfc6716-opus.txt | sed -e 's/...###//' | base64 --decode > .specs/opus-rfc6716.tar.gz
echo "86a927223e73d2476646a1b933fcd3fffb6ecc8c  .specs/opus-rfc6716.tar.gz" | sha1sum -c -
tar xzf .specs/opus-rfc6716.tar.gz -C .specs

ls -la .specs
'''
